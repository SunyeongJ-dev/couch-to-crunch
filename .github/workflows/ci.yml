name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Start a temporary Postgres just for this job. It's deleted when the job ends.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: couch_to_crunch_test
        ports:
          - 5432:5432
        # Wait until Postgres is ready before running the steps.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Fake values for CI only. Nothing here is a real secret.
    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/couch_to_crunch_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/couch_to_crunch_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci

      # Create tables, then fill them with fixed test videos.
      - run: npx prisma migrate deploy
      - run: npm run test:db:seed

      # Install Chromium (and the Linux libraries it needs).
      - run: npx playwright install --with-deps chromium

      # Build the app. Playwright starts it with `npm run start` (see playwright.config.ts).
      - run: npm run build
      - run: npx playwright test --project=chromium

      # Keep the HTML report (even if tests fail) so you can download it from the Actions page.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
